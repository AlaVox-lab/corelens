#
# Pytest configuration.
#
# NOTE: plain ASCII on purpose. pytest reads this file through configparser with the
# OS locale encoding, which on Windows is cp1252 and chokes on Vietnamese diacritics.
# Same limitation as alembic.ini. Explanatory comments live in tests/conftest.py.

[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
