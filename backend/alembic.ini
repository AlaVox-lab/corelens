#
# Alembic configuration.
#
# NOTE: this file is intentionally written in plain ASCII. Alembic reads it through
# configparser with encoding="locale", which on Windows means cp1252 and fails on
# Vietnamese diacritics. Every explanatory comment for this project lives in
# alembic/env.py instead, where Python guarantees UTF-8.
#
# sqlalchemy.url is deliberately absent: this file is committed, database passwords
# are not. See alembic/env.py.

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
