# Cấu hình git-cliff — sinh CHANGELOG.md từ lịch sử commit
#
# Cách dùng:
#   git cliff --output CHANGELOG.md              # toàn bộ lịch sử
#   git cliff --tag v0.2.0 --output CHANGELOG.md # khi cắt bản phát hành
#   git cliff --unreleased                       # xem trước phần chưa phát hành
#
# Lược đồ cấu hình của git-cliff có thay đổi giữa các phiên bản lớn.
# Nếu chạy báo lỗi, đối chiếu lại với tài liệu của phiên bản đang dùng.

[changelog]
header = """
# Nhật ký thay đổi

Toàn bộ thay đổi đáng chú ý của dự án được ghi trong tệp này.

Định dạng dựa trên Keep a Changelog, số phiên bản tuân thủ Semantic Versioning.
Nội dung được sinh tự động từ lịch sử commit theo chuẩn Conventional Commits.

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Chưa phát hành]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]($REPO_URL/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
topo_order = false

commit_parsers = [
  { message = "^feat",     group = "Tính năng mới" },
  { message = "^fix",      group = "Sửa lỗi" },
  { message = "^perf",     group = "Hiệu năng" },
  { message = "^refactor", group = "Tái cấu trúc" },
  { message = "^docs",     group = "Tài liệu" },
  { message = "^test",     group = "Kiểm thử" },
  { message = "^build",    group = "Hệ thống build" },
  { message = "^ci",       group = "Tích hợp liên tục" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore",    group = "Công việc phụ trợ" },
  { message = "^revert",   group = "Hoàn tác" },
  { body = ".*security",   group = "Bảo mật" },
]

commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}]($REPO_URL/issues/${1}))" },
]
