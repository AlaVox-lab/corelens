slice_name: Tỷ lệ ghi đè gợi ý của hệ thống (% lượt điều phối viên chọn khác)
description: Cột là tỷ lệ ghi đè theo loại gợi ý và nguồn, chấm là số lượt làm mẫu (trục bên phải).
certified_by: null
certification_details: null
viz_type: mixed_timeseries
params:
  viz_type: mixed_timeseries
  datasource: 12__table
  x_axis: nhan_goi_y
  adhoc_filters: []
  adhoc_filters_b: []
  groupby: []
  groupby_b: []
  metrics:
