#
# Dựng toàn bộ hệ thống DX-OS Lab bằng một lệnh:
#     docker compose --env-file .env up
#
# Tám dịch vụ ở cụm mặc định, một thực thể PostgreSQL duy nhất chứa ba database riêng biệt:
# dxlab (nghiệp vụ), keycloak, superset.
#
# Cổng mở ra máy (#364): cổng người dùng (FRONTEND_PORT), cổng API — cửa vào DUY NHẤT của API
# (GATEWAY_PORT) — và giao diện của các nền tảng: Keycloak, Superset, S3 của SeaweedFS, kho tri thức,
# hộp thư thử. Dịch vụ ứng dụng và PostgreSQL chỉ nghe trong mạng Compose; người phát triển mở lại hai
# cổng đó bằng tệp thứ hai docker-compose.phat-trien.yml.
#
# Vì sao một thực thể thay vì mỗi dịch vụ một cơ sở dữ liệu riêng: hệ này chỉ
# cần chạy tốt ở quy mô trình diễn — ARCHITECTURE.md mục 9 ghi rõ không tối ưu
# cho quy mô lớn. Ba thực thể PostgreSQL sẽ tốn gấp ba bộ nhớ mà không đổi lại
# lợi ích nào ở quy mô này, trong khi bảng chấm đòi cụm dựng được trên máy sạch.

name: dx-os-lab

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — một thực thể, ba database: dxlab, keycloak, superset
  # ---------------------------------------------------------------------------
  postgres:
    # PostgreSQL 16 kèm phần mở rộng pgvector (#319, ADR-0008) — ảnh chính thức của pgvector, ghim cả
    # thẻ lẫn mã băm (pgvector 0.8.6, Debian bookworm, ảnh dựng 13/08/2026). Cùng PostgreSQL 16.15 với
    # ảnh `postgres:16-alpine` trước đó nên thư mục dữ liệu cũ dùng tiếp; đổi musl sang glibc thì
    # migration 0022 tự REINDEX một lần (xem tệp đó).
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: dxlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DXLAB_DB_NAME}
      POSTGRES_USER: ${DXLAB_DB_USER}
      POSTGRES_PASSWORD: ${DXLAB_DB_PASSWORD}
      # Truyền xuống kịch bản khởi tạo để tạo hai database còn lại
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME}
      SUPERSET_READONLY_USER: ${SUPERSET_READONLY_USER}
      SUPERSET_READONLY_PASSWORD: ${SUPERSET_READONLY_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Chỉ tạo hai database còn lại và tài khoản chỉ đọc. Lược đồ cấu hình do Alembic tạo,
      # dữ liệu khởi tạo do dịch vụ ứng dụng nạp sau đó (#254) — xem dịch vụ backend dưới.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # KHÔNG mở cổng ra máy (#364): chỉ các dịch vụ trong mạng Compose nói chuyện với cơ sở dữ liệu. Kịch
    # bản trong scripts/ đi qua `docker exec`. Người phát triển cần cổng 5432 thì thêm tệp thứ hai:
    #     docker compose --env-file .env -f docker-compose.yml -f docker-compose.phat-trien.yml up -d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DXLAB_DB_USER} -d ${DXLAB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Keycloak — định danh tập trung, xem ADR-0001
  # Realm nạp từ tệp JSON lúc khởi động: đổi vai trò là đổi dữ liệu, không đổi mã
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    container_name: dxlab-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${DXLAB_DB_USER}
      KC_DB_PASSWORD: ${DXLAB_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Cố định địa chỉ công khai của Keycloak. Không có dòng này, token lấy qua
      # trình duyệt mang iss=localhost còn token lấy từ trong mạng Compose mang
      # iss=keycloak, và dịch vụ ứng dụng sẽ từ chối một nửa số token.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      # Nhưng tài liệu discovery phải trả về địa chỉ container cho các điểm cuối
      # nội bộ, để cổng người dùng gọi được token endpoint từ trong mạng Compose.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Giới hạn bộ nhớ JVM — Keycloak là dịch vụ nặng nhất trong cụm
      JAVA_OPTS_APPEND: "-Xms256m -Xmx${KEYCLOAK_MAX_HEAP}"
    volumes:
      - ./keycloak/realm-dx-os-lab.json:/opt/keycloak/data/import/realm-dx-os-lab.json:ro
      # Chủ đề đăng nhập tiếng Việt của cổng (#236): kế thừa keycloak.v2, chỉ thêm CSS
      - ./keycloak/themes/dx-os-lab:/opt/keycloak/themes/dx-os-lab:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # SeaweedFS — lưu trữ tệp đính kèm qua S3 API, xem ADR-0002
  # Tắt telemetry: mặc định nó gửi thống kê cụm ra ngoài mỗi 24 giờ
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: dxlab-seaweedfs
    restart: unless-stopped
    command: >
      server
      -dir=/data
      -s3
      -s3.config=/etc/seaweedfs/s3-config.json
      -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_LIMIT_MB}
      -master.telemetry=false
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
      - seaweedfs-data:/data
    ports:
      - "${SEAWEEDFS_S3_PORT}:8333"

  # ---------------------------------------------------------------------------
  # Apache Superset — bảng điều khiển phân tích, xem ADR-0003
  # Dùng ảnh dẫn xuất vì ảnh gốc KHÔNG kèm trình điều khiển PostgreSQL
  # ---------------------------------------------------------------------------
  superset:
    build:
      context: ./superset
      args:
        SUPERSET_VERSION: ${SUPERSET_VERSION}
    image: dxlab-superset:${SUPERSET_VERSION}
    container_name: dxlab-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_LOAD_EXAMPLES: "no"
      # Superset đọc chuỗi kết nối từ superset_config.py, không đọc trực tiếp
      # biến SQLALCHEMY_DATABASE_URI. Đặt sai chỗ thì nó lặng lẽ dùng SQLite.
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${DXLAB_DB_USER}:${DXLAB_DB_PASSWORD}@postgres:5432/${SUPERSET_DB_NAME}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      # Bảng điều khiển đọc dữ liệu nghiệp vụ bằng tài khoản CHỈ ĐỌC (ADR-0003). Điểm vào thay
      # chuỗi này vào tệp kết nối của bảng điều khiển lúc khởi động (#304)
      SUPERSET_READONLY_URI: postgresql+psycopg2://${SUPERSET_READONLY_USER}:${SUPERSET_READONLY_PASSWORD}@postgres:5432/${DXLAB_DB_NAME}
      # Trang duy nhất được nhúng bảng điều khiển: cổng người dùng (#305), xem superset_config.py
      PORTAL_PUBLIC_URL: http://localhost:${FRONTEND_PORT}
    volumes:
      - superset-home:/app/superset_home
    ports:
      - "${SUPERSET_PORT}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      # View báo cáo do migration của dịch vụ ứng dụng tạo; dịch vụ chỉ báo khỏe sau khi chạy
      # xong migration, nên chờ nó thì bảng điều khiển nạp vào lúc view đã có
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Dịch vụ khai phá quy trình — không gian I (#314, ADR-0007)
  # Dịch vụ riêng, nơi duy nhất dùng thư viện AGPL pm4py. KHÔNG mở cổng ra máy: chỉ dịch vụ ứng
  # dụng gọi nó trong mạng của Compose, sau khi đã kiểm vai trò và gắn phạm vi phòng
  # ---------------------------------------------------------------------------
  khai-pha:
    build:
      context: ../services/khai-pha
    image: dxlab-khai-pha:${DXLAB_VERSION}
    container_name: dxlab-khai-pha
    restart: unless-stopped
    environment:
      # Tài khoản CHỈ ĐỌC riêng, do migration 0019 của dịch vụ ứng dụng tạo với cùng tên và mật khẩu
      KHAI_PHA_DATABASE_URI: postgresql://${MINING_READONLY_USER:-khai_pha_readonly}:${MINING_READONLY_PASSWORD:-doi_mat_khau_nay_truoc_khi_trien_khai}@postgres:5432/${DXLAB_DB_NAME}
      # pm4py (mặc định) hay noi_bo — bộ máy dự phòng không dùng thư viện khai phá, xem README dịch vụ
      KHAI_PHA_BO_MAY: ${MINING_ENGINE:-pm4py}
      KHAI_PHA_BOI_SO_NGHEN: ${MINING_BOTTLENECK_FACTOR:-2}
    depends_on:
      # Tài khoản chỉ đọc và view báo cáo do migration của dịch vụ ứng dụng tạo
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Mô hình ngôn ngữ cục bộ — không gian I (#316, ADR-0008). TÙY CHỌN: chỉ có khi bật hồ sơ
  #     docker compose --env-file .env --profile tri-tue up -d
  # Cụm mặc định không có dịch vụ này, không tải gì thêm, chạy đủ ở chế độ thủ công. Tệp mô hình
  # (~1,1 GB) không nằm trong ảnh hay kho mã: nó nằm trong volume `mo-hinh`, tải bằng
  #     python scripts/tai_mo_hinh.py
  # (kiểm SHA-256 ghim sẵn). KHÔNG mở cổng ra máy: chỉ dịch vụ ứng dụng gọi nó trong mạng của Compose.
  # Thẻ ảnh ghim cụ thể — scripts/tai_mo_hinh.py đọc thẻ ở dòng `image` dưới đây.
  # ---------------------------------------------------------------------------
  mo-hinh:
    image: ghcr.io/ggml-org/llama.cpp:server-b11889@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c
    container_name: dxlab-mo-hinh
    profiles: ["tri-tue"]
    restart: unless-stopped
    environment:
      LLAMA_ARG_MODEL: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      LLAMA_ARG_ALIAS: qwen2.5-1.5b-instruct-q4_k_m
      # Ngữ cảnh và số luồng CPU. Một khe xử lý: máy chỉ CPU không nhanh hơn khi chạy song song, mà
      # chia ngữ cảnh ra nhiều khe thì lời dặn kèm danh mục có thể không vừa.
      LLAMA_ARG_CTX_SIZE: ${LLM_CONTEXT_SIZE:-4096}
      LLAMA_ARG_THREADS: ${LLM_THREADS:-4}
      LLAMA_ARG_N_PARALLEL: "1"
    volumes:
      - mo-hinh:/models:ro
    # Ảnh đã có healthcheck gọi /health; nạp mô hình mất vài chục giây trên máy chậm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

  # ---------------------------------------------------------------------------
  # Mô hình nhúng véc-tơ — hồ sơ đã giải quyết tương tự (#319, ADR-0008). Cùng hồ sơ `tri-tue`, cùng
  # ảnh llama.cpp đã ghim, cùng volume `mo-hinh` (tệp Qwen3-Embedding-0.6B Q8_0, ~0,64 GB, tải bằng
  # scripts/tai_mo_hinh.py). Dịch vụ riêng vì một tiến trình llama.cpp server phục vụ đúng một mô hình,
  # và chế độ nhúng (`--embeddings`, gộp bằng token cuối như Qwen3-Embedding yêu cầu) khác chế độ sinh
  # văn bản. Không mở cổng ra máy, không dịch vụ nào depends_on nó.
  # ---------------------------------------------------------------------------
  mo-hinh-nhung:
    image: ghcr.io/ggml-org/llama.cpp:server-b11889@sha256:5741ab30aae42af23ca57d9b98a6d4544cb09c21f372f92c5ee55312fa8b8b0c
    container_name: dxlab-mo-hinh-nhung
    profiles: ["tri-tue"]
    restart: unless-stopped
    environment:
      LLAMA_ARG_MODEL: /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      LLAMA_ARG_ALIAS: qwen3-embedding-0.6b-q8_0
      LLAMA_ARG_EMBEDDINGS: "1"
      LLAMA_ARG_POOLING: last
      LLAMA_ARG_CTX_SIZE: ${EMBEDDING_CONTEXT_SIZE:-8192}
      # Lô vật lý phải chứa trọn một đoạn khi nhúng: bằng ngữ cảnh
      LLAMA_ARG_UBATCH: ${EMBEDDING_CONTEXT_SIZE:-8192}
      LLAMA_ARG_BATCH: ${EMBEDDING_CONTEXT_SIZE:-8192}
      LLAMA_ARG_THREADS: ${LLM_THREADS:-4}
    volumes:
      - mo-hinh:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  # ---------------------------------------------------------------------------
  # Kho tri thức — Wiki.js, không gian H (#321, ADR-0006). TÙY CHỌN: chỉ có khi bật hồ sơ
  #     docker compose --env-file .env --profile tri-thuc up -d
  # Wiki.js (AGPL-3.0) chạy NGUYÊN ẢNH CHÍNH THỨC như dịch vụ độc lập: không dựng ảnh riêng, không vá
  # mã, dịch vụ ứng dụng chỉ nói chuyện qua GraphQL và người dùng qua OIDC (LICENSES.md). Dữ liệu nằm
  # trong database riêng `WIKI_DB_NAME` trên PostgreSQL của cụm — không thêm ảnh CSDL nào.
  #
  # Ba bước, theo thứ tự depends_on:
  #   tri-thuc-chuan-bi  tạo database, tạo/cập nhật client OIDC trong Keycloak (chạy được cả trên realm
  #                      đã nạp từ trước, vì Keycloak không nạp lại tệp realm)
  #   kho-tri-thuc       Wiki.js
  #   tri-thuc-khoi-tao  hoàn tất cài đặt lần đầu, đăng nhập một lần, nhóm theo vai trò, khóa API chỉ
  #                      đọc (ghi vào volume tri-thuc-khoa), bài hướng dẫn mẫu
  # Hai bước khởi tạo chạy trong ảnh của dịch vụ ứng dụng (đã có Python), kịch bản ở infra/tri-thuc/;
  # chạy lại bao nhiêu lần cũng được.
  # ---------------------------------------------------------------------------
  tri-thuc-chuan-bi:
    build:
      context: ../backend
    image: dxlab-backend:${DXLAB_VERSION}
    container_name: dxlab-tri-thuc-chuan-bi
    profiles: ["tri-thuc"]
    entrypoint: ["python", "/tri-thuc/khoi_tao.py", "chuan-bi"]
    environment: &moi-truong-tri-thuc
      PGHOST: postgres
      PGUSER: ${DXLAB_DB_USER}
      PGPASSWORD: ${DXLAB_DB_PASSWORD}
      PGDATABASE: ${DXLAB_DB_NAME}
      WIKI_DB_NAME: ${WIKI_DB_NAME:-wiki}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      WIKI_INTERNAL_URL: http://kho-tri-thuc:3000
      WIKI_PUBLIC_URL: http://localhost:${WIKI_PORT:-3100}
      WIKI_OIDC_CLIENT_ID: ${WIKI_OIDC_CLIENT_ID:-dx-wiki}
      WIKI_OIDC_SECRET: ${WIKI_OIDC_SECRET:-doi_bi_mat_nay_truoc_khi_trien_khai}
      # Khóa của chiến lược đăng nhập trong Wiki.js: đường dẫn /login/<khóa> mà cổng mở để vào thẳng
      WIKI_STRATEGY_KEY: ${WIKI_STRATEGY_KEY:-keycloak}
      WIKI_GROUPS_CLAIM: ${WIKI_GROUPS_CLAIM:-wiki_groups}
      # Vai trò realm được đọc / được viết bài. Mỗi vai một nhóm Wiki.js cùng tên
      WIKI_READ_ROLES: ${WIKI_READ_ROLES:-requester,classifier,approver,handler,administrator}
      WIKI_WRITE_ROLES: ${WIKI_WRITE_ROLES:-classifier,approver,administrator}
      WIKI_API_GROUP: ${WIKI_API_GROUP:-dx-os-lab-doc}
      WIKI_ADMIN_EMAIL: ${WIKI_ADMIN_EMAIL:-quan-tri-wiki@dx-os-lab.test}
      WIKI_ADMIN_PASSWORD: ${WIKI_ADMIN_PASSWORD:-doi_mat_khau_nay_truoc_khi_trien_khai}
      WIKI_SITE_TITLE: ${WIKI_SITE_TITLE:-Kho tri thức DX-OS Lab}
      WIKI_LOCALE: ${WIKI_LOCALE:-vi}
      WIKI_SEED_DIR: /tri-thuc/bai-mau
      WIKI_API_KEY_FILE: /khoa/wiki-api-key
    volumes:
      - ./tri-thuc:/tri-thuc:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  kho-tri-thuc:
    # Wiki.js 2.5.315, dựng 21/09/2026; /wiki/LICENSE trong ảnh mở đầu "GNU AFFERO GENERAL PUBLIC LICENSE"
    image: requarks/wiki:2.5.315@sha256:af71a17dc27ccc4c768591b1c504631ed820d9d13d4e8c325be4232c0035638c
    container_name: dxlab-kho-tri-thuc
    profiles: ["tri-thuc"]
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DXLAB_DB_USER}
      DB_PASS: ${DXLAB_DB_PASSWORD}
      DB_NAME: ${WIKI_DB_NAME:-wiki}
    ports:
      - "${WIKI_PORT:-3100}:3000"
    # Chỉ kiểm cổng mở: lúc cài đặt lần đầu Wiki.js chưa có /healthz
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    depends_on:
      tri-thuc-chuan-bi:
        condition: service_completed_successfully

  tri-thuc-khoi-tao:
    build:
      context: ../backend
    image: dxlab-backend:${DXLAB_VERSION}
    container_name: dxlab-tri-thuc-khoi-tao
    profiles: ["tri-thuc"]
    entrypoint: ["python", "/tri-thuc/khoi_tao.py", "khoi-tao"]
    # Ghi khóa API vào volume mới tạo (chủ sở hữu root); tệp khóa để quyền đọc cho dịch vụ ứng dụng
    user: root
    environment: *moi-truong-tri-thuc
    volumes:
      - ./tri-thuc:/tri-thuc:ro
      - tri-thuc-khoa:/khoa
    depends_on:
      kho-tri-thuc:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Quét mã độc tệp đính kèm — ClamAV (#248). TÙY CHỌN: chỉ có khi bật hồ sơ
  #     docker compose --env-file .env --profile quet-tep up -d
  # rồi đặt CLAMAV_HOST=quet-tep trong .env. ClamAV (GPL-2.0) chạy như dịch vụ ĐỘC LẬP; dịch vụ ứng
  # dụng nói chuyện với clamd qua giao thức mạng (lệnh INSTREAM, cổng 3310) bằng thư viện chuẩn
  # Python — không nhúng, không liên kết mã ClamAV (LICENSES.md). Ảnh đã kèm sẵn cơ sở mẫu nhận diện
  # nên quét được ngay cả khi không có mạng; freshclam cập nhật mẫu khi có mạng (tắt bằng
  # CLAMAV_NO_FRESHCLAMD=true). Nạp mẫu tốn khoảng 1 GB bộ nhớ và vài chục giây lúc khởi động.
  # KHÔNG mở cổng ra máy, không dịch vụ nào depends_on nó.
  # ---------------------------------------------------------------------------
  quet-tep:
    image: clamav/clamav:1.5.3@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
    container_name: dxlab-quet-tep
    profiles: ["quet-tep"]
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:-false}
    # Ảnh có sẵn healthcheck (clamdcheck.sh gửi PING); chỉ nới thời gian chờ nạp mẫu
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 360s
      retries: 6

  # ---------------------------------------------------------------------------
  # Hộp thư thử — Mailpit (#251). TÙY CHỌN, để trình diễn thông báo thư: chỉ có khi bật hồ sơ
  #     docker compose --env-file .env --profile thu-thu up -d
  # rồi đặt SMTP_HOST=thu-thu, SMTP_PORT=1025 trong .env. Mailpit nhận mọi thư qua SMTP, không chuyển
  # đi đâu; xem thư ở http://localhost:${MAILPIT_UI_PORT} (mặc định 8025). Triển khai thật thì bỏ hồ sơ
  # này, trỏ SMTP_HOST tới máy chủ thư của doanh nghiệp. Không dịch vụ nào depends_on nó.
  # ---------------------------------------------------------------------------
  thu-thu:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    container_name: dxlab-thu-thu
    profiles: ["thu-thu"]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    # Ảnh có sẵn lệnh `readyz` cho healthcheck
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  # ---------------------------------------------------------------------------
  # Dịch vụ ứng dụng — FastAPI
  # Toàn bộ nghiệp vụ nằm trong bảng dữ liệu, xem ARCHITECTURE.md mục 5.2
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
    image: dxlab-backend:${DXLAB_VERSION}
    container_name: dxlab-backend
    restart: unless-stopped
    environment:
      # psycopg 3 dùng tiền tố postgresql+psycopg. Superset ở trên dùng psycopg2 —
      # hai trình điều khiển khác nhau, đừng chép nhầm chuỗi của nhau.
      DXLAB_DATABASE_URI: postgresql+psycopg://${DXLAB_DB_USER}:${DXLAB_DB_PASSWORD}@postgres:5432/${DXLAB_DB_NAME}
      DXLAB_APP_VERSION: ${DXLAB_VERSION}
      # Hai địa chỉ cho cùng một Keycloak, cố ý khác nhau — xem app/config.py.
      # Đối chiếu iss bằng địa chỉ công khai, đi lấy khóa bằng địa chỉ nội bộ.
      DXLAB_OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      DXLAB_OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      DXLAB_OIDC_AUDIENCE: ${KEYCLOAK_API_CLIENT_ID}
      DXLAB_OIDC_DEPARTMENT_GROUP_PREFIX: ${KEYCLOAK_DEPARTMENT_GROUP_PREFIX}
      # Danh bạ người dùng (#84) — lối duy nhất dịch vụ gọi ngược sang Keycloak, và chỉ
      # khi trưởng phòng mở ô chọn người xử lý. Cố ý KHÔNG depends_on keycloak: Keycloak
      # tắt thì dịch vụ vẫn lên, chỉ ô chọn người báo không nạp được danh sách.
      DXLAB_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      DXLAB_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      DXLAB_DIRECTORY_CLIENT_ID: ${KEYCLOAK_DIRECTORY_CLIENT_ID}
      DXLAB_DIRECTORY_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_SECRET}
      # Bộ quét hồ sơ quá hạn. Hạ chu kỳ xuống vài giây khi cần trình diễn việc
      # tự leo thang mà không phải ngồi chờ.
      # Nhật ký (#247): json — mỗi dòng một đối tượng JSON mang mã yêu cầu; text — dạng chữ để đọc tay
      DXLAB_LOG_FORMAT: ${LOG_FORMAT:-json}
      DXLAB_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DXLAB_SLA_SCAN_ENABLED: ${SLA_SCAN_ENABLED}
      DXLAB_SLA_SCAN_INTERVAL_SECONDS: ${SLA_SCAN_INTERVAL_SECONDS}
      # Ngưỡng cảnh báo của bộ quét (#253). Có giá trị mặc định để tệp .env cũ vẫn chạy được.
      # Ngưỡng "quá lâu" bằng 0 là tự tính: năm lần chu kỳ quét.
      DXLAB_SLA_SCAN_STALE_AFTER_SECONDS: ${SLA_SCAN_STALE_AFTER_SECONDS:-0}
      DXLAB_SLA_SCAN_MAX_CONSECUTIVE_ERRORS: ${SLA_SCAN_MAX_CONSECUTIVE_ERRORS:-3}
      # Giới hạn tốc độ theo người dùng (#243): số lần tối đa mỗi cửa sổ giây, 0 là tắt
      DXLAB_RATE_LIMIT_CREATE_CASE_MAX: ${RATE_LIMIT_CREATE_CASE_MAX:-30}
      DXLAB_RATE_LIMIT_CREATE_CASE_WINDOW_SECONDS: ${RATE_LIMIT_CREATE_CASE_WINDOW_SECONDS:-60}
      DXLAB_RATE_LIMIT_UPLOAD_MAX: ${RATE_LIMIT_UPLOAD_MAX:-20}
      DXLAB_RATE_LIMIT_UPLOAD_WINDOW_SECONDS: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:-60}
      DXLAB_RATE_LIMIT_MESSAGE_MAX: ${RATE_LIMIT_MESSAGE_MAX:-60}
      DXLAB_RATE_LIMIT_MESSAGE_WINDOW_SECONDS: ${RATE_LIMIT_MESSAGE_WINDOW_SECONDS:-60}
      # Tệp đính kèm (#80) qua S3 API của SeaweedFS, trong mạng của Compose. Có giá trị mặc
      # định để tệp .env cũ chưa có các biến này vẫn chạy được. Cố ý KHÔNG depends_on
      # seaweedfs: kho tệp tắt thì dịch vụ vẫn lên, chỉ phần đính kèm báo lỗi.
      DXLAB_S3_ENDPOINT: http://seaweedfs:8333
      DXLAB_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-dxlab_access_key}
      DXLAB_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-doi_mat_khau_nay_truoc_khi_trien_khai}
      DXLAB_S3_BUCKET: ${SEAWEEDFS_BUCKET:-dxlab-attachments}
      DXLAB_ATTACHMENT_ALLOWED_EXTENSIONS: ${ATTACHMENT_ALLOWED_EXTENSIONS:-png,jpg,jpeg,gif,webp,pdf,doc,docx,xls,xlsx,txt,csv}
      DXLAB_ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-10}
      DXLAB_ATTACHMENT_MAX_FILES: ${ATTACHMENT_MAX_FILES:-5}
      DXLAB_ATTACHMENT_MAX_FILES_PER_CASE: ${ATTACHMENT_MAX_FILES_PER_CASE:-20}
      # Quét mã độc (#248). Rỗng là TẮT — mặc định của cụm: tệp chỉ được kiểm đuôi, chữ ký, macro.
      # Bật hồ sơ `quet-tep` thì đặt CLAMAV_HOST=quet-tep. Cố ý KHÔNG depends_on: dịch vụ quét tắt hay
      # đang nạp mẫu thì tải tệp theo CLAMAV_ON_UNAVAILABLE (mặc định nhận, gắn cờ "chưa quét").
      DXLAB_CLAMAV_HOST: ${CLAMAV_HOST:-}
      DXLAB_CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      DXLAB_CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      DXLAB_CLAMAV_ON_UNAVAILABLE: ${CLAMAV_ON_UNAVAILABLE:-accept}
      # Thông báo thư (#251). SMTP_HOST rỗng là TẮT — mặc định của cụm: không xếp hàng, không gửi gì.
      # Bật hồ sơ `thu-thu` thì đặt SMTP_HOST=thu-thu, SMTP_PORT=1025. Cố ý KHÔNG depends_on: máy chủ
      # thư sập thì thư nằm chờ trong hàng đợi, chuyển trạng thái vẫn chạy.
      DXLAB_SMTP_HOST: ${SMTP_HOST:-}
      DXLAB_SMTP_PORT: ${SMTP_PORT:-25}
      DXLAB_SMTP_USERNAME: ${SMTP_USERNAME:-}
      DXLAB_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DXLAB_SMTP_SECURITY: ${SMTP_SECURITY:-none}
      DXLAB_SMTP_FROM: ${SMTP_FROM:-DX-OS Lab <khong-tra-loi@dx-os-lab.test>}
      DXLAB_NOTIFY_SCAN_INTERVAL_SECONDS: ${NOTIFY_SCAN_INTERVAL_SECONDS:-30}
      DXLAB_NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-5}
      DXLAB_NOTIFY_RETRY_AFTER_SECONDS: ${NOTIFY_RETRY_AFTER_SECONDS:-60}
      DXLAB_NOTIFY_DIRECTORY_CACHE_SECONDS: ${NOTIFY_DIRECTORY_CACHE_SECONDS:-120}
      # Ủy quyền khi vắng mặt (#252): một lần khai dài tối đa chừng này ngày
      DXLAB_DELEGATION_MAX_DAYS: ${DELEGATION_MAX_DAYS:-60}
      # Kho tri thức (#321). WIKI_URL rỗng là TẮT — mặc định của cụm: thanh bên không có lối vào, gợi ý khi
      # soạn chỉ có hồ sơ đã giải quyết. Bật hồ sơ `tri-thuc` thì đặt WIKI_URL=http://localhost:3100. Lập
      # chỉ mục bài cần thêm mô hình nhúng (EMBEDDING_URL). Cố ý KHÔNG depends_on kho-tri-thuc: wiki tắt
      # thì chỉ lối vào và gợi ý bài vắng mặt. Khóa API chỉ đọc đọc từ volume tri-thuc-khoa.
      DXLAB_WIKI_PUBLIC_URL: ${WIKI_URL:-}
      DXLAB_WIKI_INDEX_INTERVAL_SECONDS: ${WIKI_INDEX_INTERVAL_SECONDS:-120}
      # Bảng điều khiển nhúng trong cổng (#305): dịch vụ xin token khách qua địa chỉ nội bộ,
      # trình duyệt tải bảng điều khiển qua địa chỉ công khai. Cố ý KHÔNG depends_on superset
      # (chính Superset chờ dịch vụ này): Superset tắt thì chỉ mục Báo cáo báo không phản hồi.
      DXLAB_SUPERSET_INTERNAL_URL: http://superset:8088
      DXLAB_SUPERSET_PUBLIC_URL: http://localhost:${SUPERSET_PORT}
      DXLAB_SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      DXLAB_SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      DXLAB_PORTAL_PUBLIC_URL: http://localhost:${FRONTEND_PORT}
      # Dịch vụ khai phá quy trình (#314). Cố ý KHÔNG depends_on khai-pha (chính nó chờ dịch vụ này):
      # dịch vụ khai phá tắt thì chỉ màn quy trình thực tế báo không phản hồi. Migration 0019 tạo tài
      # khoản chỉ đọc của nó bằng tên và mật khẩu dưới đây.
      DXLAB_MINING_URL: http://khai-pha:8000
      DXLAB_MINING_DB_USER: ${MINING_READONLY_USER:-khai_pha_readonly}
      DXLAB_MINING_DB_PASSWORD: ${MINING_READONLY_PASSWORD:-doi_mat_khau_nay_truoc_khi_trien_khai}
      # Mô hình ngôn ngữ (#316, #317). Rỗng là TẮT — mặc định của cụm: không gợi ý nào được sinh, mọi
      # thao tác chạy thủ công. Bật hồ sơ `tri-tue` thì đặt LLM_URL=http://mo-hinh:8080 trong .env.
      # Cố ý KHÔNG depends_on mo-hinh: mô hình tắt hay đang nạp thì dịch vụ vẫn lên và vẫn phục vụ.
      DXLAB_LLM_URL: ${LLM_URL:-}
      DXLAB_LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      DXLAB_SUGGEST_SCAN_INTERVAL_SECONDS: ${SUGGEST_SCAN_INTERVAL_SECONDS:-30}
      DXLAB_SUGGEST_MAX_ATTEMPTS: ${SUGGEST_MAX_ATTEMPTS:-3}
      DXLAB_SUGGEST_RETRY_AFTER_SECONDS: ${SUGGEST_RETRY_AFTER_SECONDS:-600}
      DXLAB_SUGGEST_DEPARTMENT_FROM_MODEL: ${SUGGEST_DEPARTMENT_FROM_MODEL:-false}
      # Gợi ý người xử lý cho trưởng phòng (#318) — không cần mô hình, bật ở cụm mặc định
      DXLAB_ASSIGNEE_SUGGEST_ENABLED: ${ASSIGNEE_SUGGEST_ENABLED:-true}
      DXLAB_ASSIGNEE_SUGGEST_LOAD_WEIGHT: ${ASSIGNEE_SUGGEST_LOAD_WEIGHT:-1.0}
      DXLAB_ASSIGNEE_SUGGEST_EXPERIENCE_WEIGHT: ${ASSIGNEE_SUGGEST_EXPERIENCE_WEIGHT:-1.0}
      DXLAB_ASSIGNEE_SUGGEST_HISTORY_DAYS: ${ASSIGNEE_SUGGEST_HISTORY_DAYS:-365}
      # Hồ sơ đã giải quyết tương tự (#319). Rỗng là TẮT — biểu mẫu Gửi yêu cầu như cũ. Bật hồ sơ
      # `tri-tue` thì đặt EMBEDDING_URL=http://mo-hinh-nhung:8080 trong .env. Cố ý KHÔNG depends_on.
      DXLAB_EMBEDDING_URL: ${EMBEDDING_URL:-}
      DXLAB_SIMILAR_TIMEOUT_SECONDS: ${SIMILAR_TIMEOUT_SECONDS:-2}
      DXLAB_SIMILAR_MAX_RESULTS: ${SIMILAR_MAX_RESULTS:-3}
      DXLAB_SIMILAR_MIN_SCORE: ${SIMILAR_MIN_SCORE:-0.55}
      DXLAB_SIMILAR_ABANDON_AFTER_MINUTES: ${SIMILAR_ABANDON_AFTER_MINUTES:-30}
      # Khuyến nghị cải tiến trên màn Quy trình thực tế (#320): dùng mô hình sinh văn bản (LLM_URL),
      # sinh ở nền. LLM_URL rỗng hay cờ tắt — màn chỉ có câu kết luận dựng từ con số
      DXLAB_RECOMMENDATION_ENABLED: ${RECOMMENDATION_ENABLED:-true}
      DXLAB_RECOMMENDATION_TIMEOUT_SECONDS: ${RECOMMENDATION_TIMEOUT_SECONDS:-90}
      DXLAB_RECOMMENDATION_MAX_SENTENCES: ${RECOMMENDATION_MAX_SENTENCES:-4}
    volumes:
      # Dữ liệu khởi tạo (#254): bộ nạp chạy sau Alembic, nạp lần đầu khi chưa có bộ quy tắc nào
      # rồi lần nào khởi động cũng kiểm nhất quán đồ thị — app/cau_hinh/khoi_tao.py
      - ./seed:/seed:ro
      # Khóa API chỉ đọc của kho tri thức (#321), do tri-thuc-khoi-tao ghi; rỗng khi chưa bật hồ sơ đó
      - tri-thuc-khoa:/run/tri-thuc:ro
    # KHÔNG mở cổng ra máy (#364): mọi lời gọi API từ ngoài cụm đi qua cổng API (dịch vụ cong-api ngay
    # dưới). Mở lại cổng 8000 cho người phát triển: tệp docker-compose.phat-trien.yml
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Cổng API — Apache APISIX, cửa vào duy nhất của API (ADR-0010, #364)
  # Ảnh chính thức ghim mã băm, không dựng lại; chế độ standalone đọc hai tệp trong cong-api/ (gắn chỉ
  # đọc), không etcd, không API quản trị. Kiểm token của Keycloak tại biên, giới hạn tốc độ chung, chuyển
  # mọi đường tới dịch vụ ứng dụng giữ nguyên đường dẫn. Hai cổng nghe:
  #   9080  ánh xạ ra máy (GATEWAY_PORT) — cho mọi bên gọi API từ ngoài cụm
  #   9081  chỉ trong mạng Compose — cổng người dùng gọi qua đây, cổng API tin X-Real-IP của nó
  # Cố ý KHÔNG depends_on keycloak: Keycloak chưa lên thì lời gọi cần token nhận 401, đường công khai vẫn
  # chạy, và cổng tự hồi phục khi Keycloak lên — không làm cụm kẹt.
  # ---------------------------------------------------------------------------
  cong-api:
    image: apache/apisix:3.20.0-debian@sha256:013de62a9dfba7d8e6006b3e85b524c28c9f1c3549fca3b91d5b258b0b9e759a
    container_name: dxlab-cong-api
    restart: unless-stopped
    environment:
      # Điểm vào của ảnh chỉ chạy `apisix init`, bỏ bước khởi tạo etcd
      APISIX_STAND_ALONE: "true"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      # Token phải mang client này trong aud — cùng giá trị DXLAB_OIDC_AUDIENCE của dịch vụ ứng dụng
      GATEWAY_OIDC_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID}
      # Độ lệch đồng hồ cho phép khi xét hạn token, giây — cùng mặc định với dịch vụ ứng dụng
      GATEWAY_TOKEN_LEEWAY_SECONDS: ${GATEWAY_TOKEN_LEEWAY_SECONDS:-10}
      # Giới hạn tốc độ chung theo địa chỉ người gọi: số lời gọi tối đa mỗi cửa sổ giây. Đủ rộng cho một
      # văn phòng dùng chung địa chỉ và cho bộ kiểm thử giao diện (e2e/) chạy liền một mạch
      GATEWAY_RATE_LIMIT_COUNT: ${GATEWAY_RATE_LIMIT_COUNT:-3000}
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Trần thân yêu cầu, MB: không thấp hơn ATTACHMENT_MAX_FILES x ATTACHMENT_MAX_MB (mặc định 5 x 10)
      # cộng phần đầu của biểu mẫu nhiều phần. Tăng hai biến kia thì tăng biến này theo
      GATEWAY_MAX_BODY_MB: ${GATEWAY_MAX_BODY_MB:-64}
      # Thời gian chờ gửi và đọc từ dịch vụ ứng dụng, giây: không thấp hơn lời gọi đồng bộ lâu nhất của
      # dịch vụ (tải nhiều tệp kèm quét mã độc, khai phá quy trình)
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-120}
    volumes:
      # Gắn từng tệp, không gắn cả thư mục conf/: `apisix init` còn ghi nginx.conf vào đó
      - ./cong-api/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./cong-api/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${GATEWAY_PORT:-9080}:9080"
    # Ảnh không có curl hay wget: hỏi điểm trạng thái nội bộ bằng bash. /status/ready trả 200 khi mọi
    # tiến trình làm việc đã nạp xong tuyến — không phụ thuộc Keycloak hay dịch vụ ứng dụng
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Cổng người dùng — Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
    image: dxlab-frontend:${DXLAB_VERSION}
    container_name: dxlab-frontend
    restart: unless-stopped
    environment:
      # Gọi dịch vụ ứng dụng QUA CỔNG API (#364), ở cổng nội bộ 9081 trong mạng của Compose — token
      # được kiểm tại biên như mọi bên gọi khác. Trình duyệt của người dùng không bao giờ thấy địa chỉ này.
      BACKEND_INTERNAL_URL: http://cong-api:9081
      # Thời hạn chờ mỗi lời gọi sang dịch vụ ứng dụng, mili giây (#235)
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-10000}
      # Trình duyệt đi qua địa chỉ công khai, máy chủ Next.js đi qua địa chỉ nội bộ
      OIDC_ISSUER_PUBLIC: http://localhost:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${KEYCLOAK_PORTAL_SECRET}
      OIDC_REDIRECT_URI: http://localhost:${FRONTEND_PORT}/api/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:${FRONTEND_PORT}
      # Địa chỉ gốc mà trình duyệt nhìn thấy. Không suy ra từ yêu cầu được: trong
      # container, máy chủ Next.js nghe ở 0.0.0.0 nên mọi chuyển hướng tương đối
      # sẽ trỏ về http://0.0.0.0:3000 và trình duyệt đi tới đó sẽ lạc.
      PORTAL_PUBLIC_URL: http://localhost:${FRONTEND_PORT}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      # Gốc công khai của Superset (#243): chính sách nội dung chỉ cho cổng nhúng khung từ đây.
      # Cùng giá trị với DXLAB_SUPERSET_PUBLIC_URL của dịch vụ ứng dụng.
      SUPERSET_PUBLIC_URL: http://localhost:${SUPERSET_PORT}
      # Mã nguồn của dịch vụ khai phá (AGPL-3.0-or-later, điều 13 — #340): màn Quy trình thực tế dẫn
      # tới đây. Có mặc định để tệp .env cũ vẫn chạy được.
      MINING_SOURCE_URL: ${MINING_SOURCE_URL:-https://github.com/AlaVox-lab/dx-os-lab/tree/main/services/khai-pha}
      # Giới hạn đăng nhập quay về theo địa chỉ IP (#243), đếm trong bộ nhớ của cổng. Có giá trị
      # mặc định để tệp .env cũ vẫn chạy được.
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-30}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      # Cổng API chờ dịch vụ ứng dụng khỏe rồi mới lên, nên chờ nó là chờ cả hai
      cong-api:
        condition: service_healthy


volumes:
  postgres-data:
  seaweedfs-data:
  superset-home:
  # Tệp mô hình của hồ sơ `tri-tue` (#316). `down -v` xóa cả volume này — phải tải lại mô hình
  mo-hinh:
  # Khóa API chỉ đọc của kho tri thức (#321), do tri-thuc-khoi-tao ghi, dịch vụ ứng dụng đọc
  tri-thuc-khoa:
