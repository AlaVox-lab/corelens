# Chủ đề đăng nhập của cổng (#236). Kế thừa chủ đề keycloak.v2 có sẵn của Keycloak và chỉ
# thêm một tệp CSS đổi màu, phông cho khớp cổng — không sửa mã hay tệp nào của nền tảng
# (ADR-0001). Chữ tiếng Việt lấy từ bản dịch messages_vi đi kèm Keycloak; realm đặt ngôn
# ngữ mặc định là tiếng Việt. messages/messages_vi.properties chỉ thay vài chuỗi của màn
# xác thực hai lớp (#366) cho khớp tên gọi trong tài liệu.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/dx-os-lab.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
darkMode=true
