#
# Tích hợp liên tục (#241): chạy trên mỗi pull request vào dev và main. Không chạy lại khi
# hai nhánh nhận commit: nội dung đó vừa chạy xanh ở chính pull request đưa nó vào. Năm việc tách thành năm job chạy song song để kết quả hiện
# riêng trên pull request; tên job là tên kiểm tra sẽ đặt bắt buộc khi kho công khai
# (CONTRIBUTING.md mục 2.6).

name: Tích hợp liên tục

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  header:
    name: Header giấy phép
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kiem_header.py

  giao-dien:
    name: Giao diện — dựng và kiểm kiểu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Dựng trước để Next sinh kiểu của route vào .next/types mà next-env.d.ts trỏ tới.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck

  # Trang tài liệu (#279) phải luôn dựng được từ mã nguồn, như cổng và dịch vụ.
  tai-lieu:
    name: Trang tài liệu — dựng
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  cum:
    name: Cụm — dựng ảnh và kiểm thử dịch vụ
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file infra/.env -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      # Ranh giới AGPL (ADR-0007): PM4Py chỉ được nhập trong services/khai-pha/. Bước rẻ nhất nên đứng
      # đầu — vi phạm thì dừng trước khi dựng ảnh. `git grep` thoát 0 khi TÌM THẤY, nên tìm thấy là hỏng.
      - name: Ranh giới AGPL — không nhập pm4py ngoài dịch vụ khai phá
        run: |
          if git grep -nE '^[[:space:]]*(import|from)[[:space:]]+pm4py([[:space:].]|$)' \
            -- '*.py' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.sh' ':(exclude)services/khai-pha'; then
            echo "pm4py (AGPL-3.0-or-later) chỉ được nhập trong services/khai-pha/ — xem ADR-0007"; exit 1
          fi
          if git grep -nEi 'pm4py' \
            -- 'backend/requirements*.txt' 'backend/pyproject.toml' 'frontend/package.json' \
            'frontend/package-lock.json' 'docs-site/package.json' 'docs-site/package-lock.json'; then
            echo "pm4py không được khai làm phụ thuộc của dịch vụ ứng dụng, cổng hay trang tài liệu — xem ADR-0007"; exit 1
          fi
      # Đúng cách dựng ghi trong README: tệp .env mẫu chạy được ngay không cần sửa.
      - run: cp infra/.env.example infra/.env
      - name: Dựng ảnh dịch vụ, dịch vụ khai phá và giao diện
        run: $COMPOSE build backend khai-pha frontend
      # Cổng API (#364) là ảnh kéo về, không dựng; nó chờ dịch vụ ứng dụng khỏe rồi mới lên
      - name: Bật PostgreSQL, Keycloak, SeaweedFS, dịch vụ ứng dụng, dịch vụ khai phá và cổng API
        run: $COMPOSE up -d postgres keycloak seaweedfs backend khai-pha cong-api
      # Dịch vụ ứng dụng không còn mở cổng ra máy: hỏi sức khỏe qua cổng API, đúng đường người dùng đi
      - name: Chờ dịch vụ và Keycloak sẵn sàng
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:9080/health >/dev/null \
              && curl -fsS http://localhost:8080/realms/dx-os-lab >/dev/null; then
              echo "Sẵn sàng sau $((i * 2)) giây"; exit 0
            fi
            sleep 2
          done
          echo "Hết thời gian chờ cụm khởi động"; exit 1
      # Định nghĩa hoàn thành của #364: từ máy chủ không gọi thẳng được dịch vụ ứng dụng hay PostgreSQL, và
      # cổng API chặn lời gọi thiếu token trước khi tới dịch vụ (dịch vụ luôn trả lại X-Request-ID; phản hồi
      # của cổng thì không). Các trường hợp còn lại — token đúng, hết hạn, khóa lạ, sai người nhận, vượt
      # ngưỡng — nằm trong tests/test_cong_api.py, chạy cùng bộ kiểm thử dịch vụ ở bước dưới.
      - name: Cổng API là cửa vào duy nhất
        run: |
          if curl -sS --max-time 3 http://localhost:8000/health; then
            echo "Cổng 8000 của dịch vụ ứng dụng vẫn mở ra máy chủ"; exit 1
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
            echo "Cổng 5432 của PostgreSQL vẫn mở ra máy chủ"; exit 1
          fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9080/health)" = 200
          tieu_de=$(curl -s -o /dev/null -D - -H 'X-Request-ID: kiem-ci' http://localhost:9080/me)
          echo "$tieu_de" | head -n 1 | grep -q ' 401'
          if echo "$tieu_de" | grep -qi '^x-request-id:'; then
            echo "Lời gọi thiếu token đã tới dịch vụ ứng dụng"; exit 1
          fi
      # Dịch vụ khai phá chờ dịch vụ ứng dụng (migration tạo tài khoản chỉ đọc của nó) rồi mới lên; ảnh
      # nạp sẵn PM4Py nên thường vài giây, healthcheck cho tối đa 60 giây khởi động.
      - name: Chờ dịch vụ khai phá sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' dxlab-khai-pha)" = healthy ]; then
              echo "Sẵn sàng sau $((i * 3)) giây"; exit 0
            fi
            sleep 3
          done
          echo "Dịch vụ khai phá không lên được"; exit 1
      # Bài bị bỏ qua cũng tính là hỏng: thiếu PostgreSQL, Keycloak hay cổng API thì phải ra đỏ.
      - name: Kiểm thử dịch vụ ứng dụng và cổng API
        run: docker exec -e DXLAB_CAM_BO_QUA=1 dxlab-backend python -m pytest -p no:cacheprovider -q
      # Bài có đáp án biết trước, chạy trong ảnh của dịch vụ khai phá với cả hai bộ máy (pm4py và noi_bo)
      - name: Kiểm thử dịch vụ khai phá
        run: docker exec -e DXLAB_CAM_BO_QUA=1 dxlab-khai-pha python -m pytest -p no:cacheprovider -q
      - name: Nhật ký cụm khi hỏng
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 postgres keycloak seaweedfs backend khai-pha cong-api

  bang-dieu-khien:
    name: Bảng điều khiển — dựng và tự nạp
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file infra/.env -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env
      # Superset chờ dịch vụ ứng dụng chạy xong migration tạo view báo cáo, rồi nạp dashboard từ
      # infra/superset/bang-dieu-khien/ (#304). Keycloak không cần cho bước này.
      - name: Dựng và bật PostgreSQL, dịch vụ ứng dụng, Superset
        run: $COMPOSE up -d --build --wait --wait-timeout 600 postgres backend superset
      - name: Dashboard và sáu biểu đồ đã nạp, đọc được view báo cáo
        run: |
          q() { docker exec dxlab-postgres psql -U dxlab -d "$1" -At -c "$2"; }
          test "$(q superset 'SELECT count(*) FROM dashboards')" = 1
          test "$(q superset 'SELECT count(*) FROM slices')" = 6
          test "$(q superset 'SELECT count(*) FROM dashboard_slices')" = 6
          for bang in $(q superset 'SELECT table_name FROM tables'); do
            docker exec dxlab-postgres psql -U superset_readonly -d dxlab -At -c "SELECT count(*) FROM $bang"
          done
          # Vai khách của bản nhúng trong cổng (#305) đọc được kết nối dữ liệu, không thì khung trống
          test "$(q superset "SELECT count(*) FROM ab_permission_view_role pvr
            JOIN ab_role r ON r.id = pvr.role_id
            JOIN ab_permission_view pv ON pv.id = pvr.permission_view_id
            JOIN ab_permission p ON p.id = pv.permission_id
            WHERE r.name = 'Gamma' AND p.name = 'database_access'")" = 1
      - name: Nhật ký cụm khi hỏng
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 postgres backend superset
