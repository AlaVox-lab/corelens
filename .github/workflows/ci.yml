#
# Tích hợp liên tục (#241): chạy trên mỗi pull request vào dev và main. Không chạy lại khi
# hai nhánh nhận commit: nội dung đó vừa chạy xanh ở chính pull request đưa nó vào. Năm việc tách thành năm job chạy song song để kết quả hiện
# riêng trên pull request; tên job là tên kiểm tra sẽ đặt bắt buộc khi kho công khai
# (CONTRIBUTING.md mục 2.6).

name: Tích hợp liên tục

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  header:
    name: Header giấy phép
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kiem_header.py

  giao-dien:
    name: Giao diện — dựng và kiểm kiểu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Dựng trước để Next sinh kiểu của route vào .next/types mà next-env.d.ts trỏ tới.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck

  # Trang tài liệu (#279) phải luôn dựng được từ mã nguồn, như cổng và dịch vụ.
  tai-lieu:
    name: Trang tài liệu — dựng
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

  cum:
    name: Cụm — dựng ảnh và kiểm thử dịch vụ
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file infra/.env -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      # Đúng cách dựng ghi trong README: tệp .env mẫu chạy được ngay không cần sửa.
      - run: cp infra/.env.example infra/.env
      - name: Dựng ảnh dịch vụ và giao diện
        run: $COMPOSE build backend frontend
      - name: Bật PostgreSQL, Keycloak, SeaweedFS và dịch vụ ứng dụng
        run: $COMPOSE up -d postgres keycloak seaweedfs backend
      - name: Chờ dịch vụ và Keycloak sẵn sàng
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null \
              && curl -fsS http://localhost:8080/realms/dx-os-lab >/dev/null; then
              echo "Sẵn sàng sau $((i * 2)) giây"; exit 0
            fi
            sleep 2
          done
          echo "Hết thời gian chờ cụm khởi động"; exit 1
      # Bài bị bỏ qua cũng tính là hỏng: thiếu PostgreSQL hay Keycloak thì phải ra đỏ.
      - name: Kiểm thử dịch vụ ứng dụng
        run: docker exec -e DXLAB_CAM_BO_QUA=1 dxlab-backend python -m pytest -p no:cacheprovider -q
      - name: Nhật ký cụm khi hỏng
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 postgres keycloak seaweedfs backend

  bang-dieu-khien:
    name: Bảng điều khiển — dựng và tự nạp
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --env-file infra/.env -f infra/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env
      # Superset chờ dịch vụ ứng dụng chạy xong migration tạo view báo cáo, rồi nạp dashboard từ
      # infra/superset/bang-dieu-khien/ (#304). Keycloak không cần cho bước này.
      - name: Dựng và bật PostgreSQL, dịch vụ ứng dụng, Superset
        run: $COMPOSE up -d --build --wait --wait-timeout 600 postgres backend superset
      - name: Dashboard và bốn biểu đồ đã nạp, đọc được view báo cáo
        run: |
          q() { docker exec dxlab-postgres psql -U dxlab -d "$1" -At -c "$2"; }
          test "$(q superset 'SELECT count(*) FROM dashboards')" = 1
          test "$(q superset 'SELECT count(*) FROM slices')" = 4
          test "$(q superset 'SELECT count(*) FROM dashboard_slices')" = 4
          for bang in $(q superset 'SELECT table_name FROM tables'); do
            docker exec dxlab-postgres psql -U superset_readonly -d dxlab -At -c "SELECT count(*) FROM $bang"
          done
          # Vai khách của bản nhúng trong cổng (#305) đọc được kết nối dữ liệu, không thì khung trống
          test "$(q superset "SELECT count(*) FROM ab_permission_view_role pvr
            JOIN ab_role r ON r.id = pvr.role_id
            JOIN ab_permission_view pv ON pv.id = pvr.permission_view_id
            JOIN ab_permission p ON p.id = pv.permission_id
            WHERE r.name = 'Gamma' AND p.name = 'database_access'")" = 1
      - name: Nhật ký cụm khi hỏng
        if: failure()
        run: $COMPOSE logs --no-color --tail=200 postgres backend superset
